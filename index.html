<style>

<script>
"use strict";
/* =====================================================================
   ✏️  EDIT ME — personal settings (everything personal lives here)
   ===================================================================== */
const CONFIG={
  name:"Carolina",          // used in greetings, praise, mascot lines and the certificate
  from:"Nestor",            // signs the notes and the certificate
  // ⚠️ PLACEHOLDER NOTES — replace with your own words!

  notes:[
    "Your very first level! I'm so proud of you. Every French word you learn makes me smile. Je t'aime. ❤️",

  $("#fb").innerHTML=`<div class="fb ${ok?"ok":"bad"}">${ok?N(pick([L("correct"),L("correct")+" "+CONFIG.name+" 💕"])):L("wrong")+" <b>"+esc(q.ans)+"</b>"}${bonus}${note}${extra}${q.qc||q.type==="fr2en"||q.type==="mc"?`<div class="mut">${esc(fr)} = ${esc(en)}</div>`:""}</div>`;
  if(q.type!=="listen")speak(fr);$("#act").innerHTML=`<button id="nx">${L("next")} →</button>`;$("#nx").onclick=()=>cb(ok);$("#nx").focus({preventScroll:true})};
 if($("#pl"))$("#pl").onclick=()=>speak(fr);if($("#sl"))$("#sl").onclick=()=>speak(fr,.6);
 if(q.type==="listen")setTimeout(()=>speak(fr),300);
 app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{if(answered)return;const ok=q.opts[+b.dataset.o]===q.ans;b.style.background=ok?"#c9efd8":"#f8d0d8";src=b;if(!ok)app.querySelectorAll("[data-o]").forEach(x=>{if(q.opts[+x.dataset.o]===q.ans)x.style.background="#c9efd8"});fin(ok)});
 const inp=$("#in");if(inp){inp.focus({preventScroll:true});const check=()=>{if(!inp.value.trim())return;src=inp;fin(typedOk(inp.value,q.ans,S.strict))};$("#ck").onclick=check;inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();answered?$("#nx").click():check()}}}
 $("#sk").onclick=()=>{stopRec();bankTime();if(q.type==="speak"){noteAnswer(null);award(q,null);return cb(null)}combo=0;setGlow(0);noteAnswer(false);award(q,false);cb(false)};
 if(q.type==="speak"){
  const typeIt=()=>{stopRec();$("#tbox").innerHTML=`<input type="text" id="in2" style="margin-top:10px" placeholder="${L("typeFr")}" lang="fr" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">`;$("#act").innerHTML=`<button id="ck2">${L("check")}</button><button class="sec" id="sk">${L("skip")}</button>`;$("#sk").onclick=()=>{stopRec();bankTime();noteAnswer(null);award(q,null);cb(null)};const i2=$("#in2");i2.focus({preventScroll:true});const ck=()=>{if(!i2.value.trim()||answered)return;src=i2;fin(typedOk(i2.value,fr,S.strict))};$("#ck2").onclick=ck;i2.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();answered?$("#nx").click():ck()}};$("#typ")&&($("#typ").disabled=true)};
  $("#typ").onclick=typeIt;
  if($("#said"))$("#said").onclick=()=>{if(answered)return;answered=true;stopRec();bankTime();noteAnswer(null);award(q,null);softChime();sparkleAt($("#said"));mood("happy",["Bravo, {n} ! Bien dit !","Well said, {n}!"]);$("#fb").innerHTML=`<div class="fb ok">🗣️ ${tr("Nice! Self-checked, no score change.","Bien ! Auto-évalué, sans effet sur le score.")}</div>`;speak(fr);$("#act").innerHTML=`<button id="nx">${L("next")} →</button>`;$("#nx").onclick=()=>cb(null)};
  if($("#mic"))$("#mic").onclick=()=>beginListen(fr,(heard,score)=>{const pct=Math.round(score*100);if(score>=.75){ach("speak");src=$("#mic");fin(true,`<div>${L("heard")}: « ${esc(heard)} » · ${L("sim")} ${pct}%</div>`)}else{$("#fb").innerHTML=`<div class="fb bad">${L("heard")}: « ${esc(heard)} » · ${L("sim")} ${pct}% (75% ${tr("needed","requis")}). ${tr("Try again, type it, or skip.","Réessaie, écris-le ou passe.")}</div>`;mood("sad",["Encore une fois !","One more time!"])}},
   err=>{if(answered)return;mood("sad",[MICMSG[err]?MICMSG[err][0]:micLine(err),micLine(err)]);
    $("#fb").innerHTML=`<div class="fb bad">🦉 ${esc(micLine(err))}</div>`;resetMicUi()})}}

/* ---------- level-up sequence ---------- */
function pass(lv,p){S.best[lv]=Math.max(S.best[lv]||0,p);S.passed[lv]=true;if(lv<10)S.unlocked=Math.max(S.unlocked,lv+1);if(lv===10&&!S.doneDate)S.doneDate=Date.now();S.xp+=50;logXp(50);save();
 ach("lv1");if(p===100)ach("perfect");const n=Object.keys(S.passed).length;if(n>=6)ach("half");if(n>=11)ach("all");celebrate(lv,p)}
function celebrate(lv,p){stopRec();setGlow(0);hdr();scrollTo(0,0);
 app.innerHTML=`<div class="card center"><div class="mascot big m-dance" id="masc">${owl()}</div><div class="tag" style="margin-top:10px">📍 ${esc(STOPS[lv].n)}</div><h2 class="title">${tr(`Level ${lv} passed!`,`Niveau ${lv} réussi !`)}</h2>
 <p class="q">${esc(N(pick(["Bravo {n} ! Tu es incroyable !","Félicitations, {n} !","Quelle championne, {n} !"])))}</p><p>${L("score")}: <b>${p}%</b> ${"⭐".repeat(p===100?3:p>=90?2:1)}</p><p class="mut">+50 XP</p>
 <button id="c1">💌 ${tr("A letter for you","Une lettre pour toi")}</button></div>`;
 fanfare();bigFx();$("#c1").onclick=()=>letter(lv)}
function letter(lv){app.innerHTML=`<div class="card center"><p class="mut">${tr("Tap the envelope","Touche l'enveloppe")}</p><div class="env" id="env"><div class="back"></div><div class="letter"><div class="script" style="font-size:22px">${tr("For","Pour")} ${esc(CONFIG.name)}</div>💕<br>${tr("from","de")} ${esc(CONFIG.from)}</div><div class="front"></div><div class="flap"></div><div class="seal">💗</div></div><div id="nt"></div></div>`;
 let opened=false;$("#env").onclick=()=>{if(opened)return;opened=true;$("#env").classList.add("open");softChime();hearts(16);setTimeout(()=>{$("#nt").innerHTML=`<div class="note" style="text-align:left;animation:rise .6s both"><div class="script">Ma chère ${esc(CONFIG.name)},</div>${esc(CONFIG.notes[lv]||"")}<div class="script" style="text-align:right">${esc(CONFIG.from)} 💕</div></div><div class="row" style="margin-top:14px"><button id="c2">${tr("Continue","Continuer")} →</button></div>`;$("#c2").onclick=()=>CONFIG.rewards[lv]?reward(lv):postcardScreen(lv)},RM?50:1400)}}
function reward(lv){const r=CONFIG.rewards[lv];app.innerHTML=`<div class="card"><div class="ticket"><div class="big">${r.emoji||"🎁"}</div><div class="tag">🎁 ${tr("Date unlocked!","Rendez-vous débloqué !")}</div><h3>${esc(r.title)}</h3><p>${esc(r.detail||"")}</p><p class="mut">${tr(`Redeem with ${CONFIG.from} · valid forever 💕`,`À échanger avec ${CONFIG.from} · valide pour toujours 💕`)}</p></div><div class="row" style="margin-top:14px;justify-content:center"><button id="c3">${tr("Continue","Continuer")} →</button></div></div>`;fanfare();hearts(30);confetti(60);$("#c3").onclick=()=>postcardScreen(lv)}
function postcardHTML(i,locked){const s=STOPS[i];return `<div class="flip${locked?"":" can"}" data-pc="${i}"><div class="in"><div class="pc${locked?" locked":""}" style="background:linear-gradient(135deg,${s.c[0]},${s.c[1]})"><span class="stamp">N° ${i}</span><span class="em">${s.e}</span><span class="sm">${locked?"":"Bisous de"}</span><span class="nm">${locked?"???":esc(s.n)}</span></div>${locked?"":`<div class="pcb"><b>${tr("From","De")} ${esc(CONFIG.from)}:</b><br>${esc(CONFIG.notes[i]||"")}</div>`}</div></div>`}
function bindFlips(){app.querySelectorAll(".flip.can").forEach(f=>f.onclick=()=>{f.classList.toggle("flipped");tone(1200,0,.12,"sine",.05)})}
function postcardScreen(lv){const s=STOPS[lv];app.innerHTML=`<div class="card center"><div class="tag">📮 ${tr("New postcard & badge!","Nouvelle carte postale et badge !")}</div><div class="solo">${postcardHTML(lv,false)}</div><div class="medal" style="background:linear-gradient(135deg,${s.c[0]},${s.c[1]})"><span>${s.e}</span></div><b>${esc(s.n)}</b><p class="mut">${tr("Tap the postcard to flip it","Touche la carte pour la retourner")}</p>
 <div class="row">${lv===10?`<button id="c4">🎓 ${tr("Your certificate","Ton certificat")}</button>`:`<button id="c4">🗺️ ${tr("Continue the journey","Continuer le voyage")} →</button>`}<button class="sec" id="c5">📮 Album</button></div></div>`;
 bindFlips();softChime();sparkleAt($(".solo"));$("#c4").onclick=()=>lv===10?cert():home();$("#c5").onclick=album}
function album(){stopRec();setGlow(0);hdr();scrollTo(0,0);const fl=S.ui==="fr"?1:0;const got=Object.keys(S.passed).length,na=Object.keys(S.ach).length;
 app.innerHTML=`<div class="card">${mascotBlock([`${got}/11 cartes postales !`,`${got}/11 postcards collected!`],"happy","sm")}<h2 class="title">📮 ${tr("Postcards","Cartes postales")}</h2><p class="mut">${tr("Tap a postcard to read its note","Touche une carte pour lire le mot")}</p><div class="pcs">${STOPS.map((_,i)=>postcardHTML(i,!S.passed[i])).join("")}</div></div>
 <div class="card"><h2 class="title">🏅 ${tr("City badges","Badges des villes")}</h2><div class="badges">${STOPS.map((s,i)=>`<div><div class="medal ${S.passed[i]?"":"locked"}" style="background:linear-gradient(135deg,${s.c[0]},${s.c[1]})"><span>${s.e}</span></div>${S.passed[i]?esc(s.n):"???"}</div>`).join("")}</div></div>
 <div class="card"><h2 class="title">✨ ${tr("Achievements","Succès")} <small class="mut">${na}/${ACH.length}</small></h2><div class="badges">${ACH.map(a=>`<div><div class="medal ${S.ach[a.id]?"":"locked"}" style="background:#fff4e0"><span>${a.e}</span></div><b>${esc(a.t[fl])}</b><br><span class="mut" style="font-size:10px">${esc(a.d[fl])}</span></div>`).join("")}</div>
 <p class="mut">${tr("Best combo","Meilleur combo")}: ${S.bestCombo} · ${tr("Correct answers","Bonnes réponses")}: ${S.correct} · 🍁 ${S.qc||0}</p></div>
 <div class="row"><button class="sec" id="bk">📍 ${tr("Back to the path","Retour au parcours")}</button>${S.passed[10]?`<button id="ce">🎓 ${tr("Certificate","Certificat")}</button>`:""}</div>`;
 bindFlips();$("#bk").onclick=home;if($("#ce"))$("#ce").onclick=()=>cert()}
function cert(force){stopRec();hdr();scrollTo(0,0);if(!S.passed[10]&&!force){home();return}
 const dt=new Date(S.doneDate||Date.now()).toLocaleDateString("fr-CA",{day:"numeric",month:"long",year:"numeric"});
 app.innerHTML=`<div class="cert"><span class="corner" style="left:18px;top:14px">⚜</span><span class="corner" style="right:18px;top:14px">⚜</span><span class="corner" style="left:18px;bottom:14px">⚜</span><span class="corner" style="right:18px;bottom:14px">⚜</span><div class="b1"><div class="b2">
 <div class="sub">Certificate of Achievement</div><h1>Certificat de réussite</h1><p style="margin:14px 0 0">Ce certificat est fièrement décerné à</p><div class="who script">${esc(CONFIG.name)}</div>
 <p style="line-height:1.5;max-width:460px;margin:8px auto">pour avoir complété les 11 niveaux du parcours <b>Français 0→10</b>, de Lévis aux Îles-de-la-Madeleine, avec courage, talent et beaucoup d'amour.</p>
 <p class="mut" style="font-style:italic">for completing all 11 levels of the French 0→10 journey across Quebec</p><div class="seal">🦉</div>
 <div class="sig"><div><span class="script" style="font-size:20px;color:#5a3446">${esc(CONFIG.from)}</span><br>${tr("With love","Avec amour")}</div><div><span style="font-size:15px;color:#5a3446">${esc(dt)}</span><br>Date</div></div></div></div></div>
 <div class="row noprint" style="margin-top:16px;justify-content:center"><button id="pt">🖨️ ${tr("Print","Imprimer")}</button><button class="sec" id="bk">📍 ${tr("Path","Parcours")}</button></div>`;
 $("#pt").onclick=()=>print();$("#bk").onclick=home;if(!force||S.passed[10]){confetti(60);hearts(12)}}

/* ---------- boot & routes (#debug-pass triggers the level-up sequence for the current level) ---------- */
$("#lang").onclick=()=>{S.ui=S.ui==="en"?"fr":"en";save();home()};$("#home").onclick=home;
$("#mute").onclick=()=>{S.muted=!S.muted;save();hdr();if(!S.muted)chime(1)};
function route(){const h=location.hash;if(h==="#debug-pass"){history.replaceState(null,"",location.pathname+location.search);pass(Math.min(S.unlocked,10),100)}else if(h==="#album")album();else if(h==="#cert")cert(true);else if(h==="#progress")dashboard();else home()}
addEventListener("hashchange",route);hdr();route();
if(typeof document.startViewTransition==="function"){let ran=false;try{document.startViewTransition(()=>{ran=true})}catch(e){}vtSync=ran}
vtOn=true;
if(inAppBrowser()&&!$("#inapp")){const b=document.createElement("div");b.id="inapp";b.className="inapp";b.innerHTML=`🎤 ${tr("This in-app browser can't use the microphone. Tap the menu and choose Open in Safari.","Ce navigateur intégré ne peut pas utiliser le micro. Ouvre le menu et choisis Ouvrir dans Safari.")}`;document.body.prepend(b)}
</script></body></html>
